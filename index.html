<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GDGoC · The Grid</title>
  <style>
    :root {
      --overlay-bg: rgba(6, 10, 18, 0.65);
      --overlay-fg: #f5f7fa;
      --overlay-accent: #4f86f7;
    }
    html, body { height: 100%; margin: 0; padding: 0; background: #1a1a1a; color: var(--overlay-fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
    canvas { display: block; }
    #app { position: fixed; inset: 0; }
    #overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--overlay-bg);
      backdrop-filter: blur(8px);
      z-index: 10;
      user-select: none;
    }
    #overlay.hidden { display: none !important; opacity: 0 !important; pointer-events: none !important; }
    #overlay .card {
      text-align: center;
      padding: 2.2rem 2.5rem;
      border-radius: 16px;
      background: rgba(16, 24, 38, 0.88);
      border: 1px solid rgba(79, 134, 247, 0.3);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6), 0 0 30px rgba(79, 134, 247, 0.15);
      max-width: 360px;
      width: 88%;
    }
    #overlay h1 { margin: 0 0 0.3rem; font-size: 1.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; }
    #overlay .subtitle { margin: 0 0 1.4rem; opacity: 0.7; font-size: 0.85rem; letter-spacing: 0.04em; }
    #join-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.4rem;
    }
    #name-input {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(8, 14, 24, 0.75);
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #name-input:focus {
      border-color: #4f86f7;
      box-shadow: 0 0 12px rgba(79, 134, 247, 0.4);
    }
    #play-btn {
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      border: none;
      background: #4f86f7;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    }
    #play-btn:hover {
      background: #3b73e8;
      box-shadow: 0 0 16px rgba(79, 134, 247, 0.5);
    }
    #play-btn:active {
      transform: scale(0.98);
    }
    #overlay .controls-hint {
      margin: 0;
      opacity: 0.75;
      font-size: 0.82rem;
      line-height: 1.5;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1rem;
    }
    #overlay .key { display: inline-block; min-width: 1.5em; padding: 0 0.35em; border-radius: 4px; background: rgba(255,255,255,0.12); font-family: ui-monospace, monospace; }
    #status {
      position: fixed; bottom: 12px; left: 12px;
      padding: 0.4rem 0.7rem;
      border-radius: 8px;
      background: rgba(8, 14, 24, 0.55);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      z-index: 5;
    }
    #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background: #c44; }
    #status.connected .dot { background: #4c4; }

    #interact-prompt {
      position: fixed; top: 60%; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center;
      background: rgba(10, 15, 25, 0.8); padding: 0.8rem 1.5rem;
      border-radius: 20px; border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(4px); pointer-events: none; opacity: 0;
      transition: opacity 0.2s; z-index: 5;
    }
    #interact-prompt.visible { opacity: 1; }
    #interact-prompt .text { font-size: 0.9rem; margin-bottom: 0.5rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
    .progress-ring {
      width: 32px; height: 32px;
    }
    .progress-ring circle {
      fill: transparent; stroke: rgba(255,255,255,0.2); stroke-width: 4;
    }
    .progress-ring .progress {
      stroke: #4f86f7; stroke-dasharray: 88; stroke-dashoffset: 88;
      transition: stroke-dashoffset 0.1s linear;
      transform: rotate(-90deg); transform-origin: 50% 50%;
    }

    #speedometer {
      position: fixed; bottom: 30px; right: 30px;
      background: rgba(10, 15, 25, 0.85); padding: 1.5rem;
      border-radius: 50%; width: 80px; height: 80px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 3px solid #222; box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.8);
      pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 5;
    }
    #speedometer.visible { opacity: 1; }
    #speed-value { font-size: 2rem; font-weight: 700; color: #fff; font-family: ui-monospace, monospace; line-height: 1; }
    #speed-unit { font-size: 0.75rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
    
    #minimap-container {
      position: fixed; top: 20px; right: 20px;
      width: 200px; height: 200px;
      background: rgba(10, 15, 25, 0.7);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      overflow: hidden;
      z-index: 5;
    }
    #minimap {
      width: 100%; height: 100%;
      display: block;
    }

    #bigmap-container {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: rgba(10, 15, 25, 0.9);
      border: 2px solid rgba(79, 134, 247, 0.5);
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      overflow: hidden;
      z-index: 20;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    #bigmap-container.visible { opacity: 1; pointer-events: auto; }
    #bigmap { width: 100%; height: 100%; display: block; }

    #elevator-ui {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      z-index: 30;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    #elevator-ui.visible { opacity: 1; pointer-events: auto; cursor: default; }
    .elevator-panel {
      background: rgba(12, 16, 28, 0.95);
      border: 1px solid rgba(79, 134, 247, 0.4);
      border-radius: 20px;
      padding: 2rem 2.5rem;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 40px rgba(79, 134, 247, 0.15);
      max-width: 420px; width: 90%;
      max-height: 80vh; overflow-y: auto;
    }
    .elevator-header {
      text-align: center;
      font-size: 1.3rem; font-weight: 700;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: #4f86f7;
      margin-bottom: 0.3rem;
    }
    .elevator-current {
      text-align: center;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
      margin-bottom: 1.2rem;
    }
    .elevator-floors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .elevator-floor-btn {
      background: rgba(30, 35, 50, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 0.7rem 0.6rem;
      color: #ddd;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.03em;
    }
    .elevator-floor-btn:hover {
      background: rgba(79, 134, 247, 0.25);
      border-color: #4f86f7;
      color: #fff;
      box-shadow: 0 0 15px rgba(79, 134, 247, 0.3);
      transform: scale(1.03);
    }
    .elevator-floor-btn.current {
      background: rgba(79, 134, 247, 0.15);
      border-color: #4f86f7;
      color: #4f86f7;
    }
    .elevator-floor-btn .floor-num {
      font-size: 1.1rem; font-weight: 700; color: #fff;
      display: block; margin-bottom: 2px;
    }
    .elevator-floor-btn.current .floor-num { color: #4f86f7; }
    .elevator-footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
    }
    /* GTA V Style HUD */
    #hud-money {
      position: fixed; top: 20px; right: 240px;
      font-family: ui-monospace, 'Impact', monospace, sans-serif;
      font-size: 1.8rem; font-weight: 900;
      color: #2dc653;
      text-shadow: 2px 2px 0px #000, 0 0 10px rgba(45, 198, 83, 0.4);
      letter-spacing: 0.05em;
      z-index: 5;
      text-align: right;
    }
    #money-delta {
      font-size: 1.1rem;
      font-weight: 700;
      transition: opacity 0.3s, transform 0.3s;
    }
    #money-delta.pos { color: #2dc653; }
    #money-delta.neg { color: #e63946; }
    #money-delta.hidden { opacity: 0; transform: translateY(-8px); }

    #hud-bars {
      position: fixed; top: 228px; right: 20px;
      width: 200px; display: flex; gap: 4px; z-index: 5;
    }
    .hud-bar-health, .hud-bar-armor {
      flex: 1; height: 7px;
      background: rgba(10, 15, 25, 0.85);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 3px; overflow: hidden;
    }
    #health-fill { width: 100%; height: 100%; background: #2dc653; }
    #armor-fill { width: 85%; height: 100%; background: #4f86f7; }

    #radio-hud {
      position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(10, 15, 25, 0.9);
      border: 1px solid #4f86f7;
      border-radius: 30px;
      padding: 0.6rem 1.6rem;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 0 25px rgba(0,0,0,0.8), 0 0 15px rgba(79, 134, 247, 0.3);
      opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 25;
    }
    #radio-hud.visible { opacity: 1; }
    .radio-icon { font-size: 1.4rem; }
    #radio-station-name { font-size: 1rem; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 0.05em; }
    #radio-station-genre { font-size: 0.75rem; color: #4f86f7; }

    #dialogue-box {
      position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
      background: rgba(10, 15, 25, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-left: 4px solid #4f86f7;
      border-radius: 12px;
      padding: 1rem 1.8rem;
      max-width: 500px; width: 90%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 20;
    }
    #dialogue-box.visible { opacity: 1; }
    #dialogue-speaker { font-size: 0.85rem; font-weight: 700; color: #4f86f7; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
    #dialogue-text { font-size: 1rem; color: #eee; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="overlay">
    <div class="card">
      <h1>GDGoC · The Grid</h1>
      <p class="subtitle">Enter your username to spawn</p>
      <form id="join-form">
        <input id="name-input" type="text" placeholder="Enter username" maxlength="15" autofocus autocomplete="off" />
        <button id="play-btn" type="submit">Enter World</button>
      </form>
      <p class="controls-hint">
        <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> move · <span class="key">Shift</span> run<br />
        <span class="key">E</span> interact · <span class="key">R</span> radio · <span class="key">H</span> horn<br />
        <span class="key">C</span> camera · <span class="key">M</span> map · <span class="key">Esc</span> release mouse
      </p>
    </div>
  </div>
  
  <div id="hud-money">
    <div id="money-val">$2,500</div>
    <div id="money-delta" class="hidden">+$200</div>
  </div>

  <div id="minimap-container">
    <canvas id="minimap" width="200" height="200"></canvas>
  </div>
  <div id="hud-bars">
    <div class="hud-bar-health"><div id="health-fill"></div></div>
    <div class="hud-bar-armor"><div id="armor-fill"></div></div>
  </div>
  
  <div id="bigmap-container">
    <canvas id="bigmap" width="600" height="600"></canvas>
  </div>

  <div id="radio-hud">
    <div class="radio-icon">📻</div>
    <div class="radio-info">
      <div id="radio-station-name">Synthwave 84.5 FM</div>
      <div id="radio-station-genre">Retrowave / Synth</div>
    </div>
  </div>

  <div id="dialogue-box">
    <div id="dialogue-speaker">Citizen</div>
    <div id="dialogue-text">Nice ride, partner!</div>
  </div>
  
  <div id="interact-prompt">
    <div class="text">Hold <span class="key">E</span> to enter</div>
    <svg class="progress-ring">
      <circle cx="16" cy="16" r="14"></circle>
      <circle class="progress" cx="16" cy="16" r="14"></circle>
    </svg>
  </div>

  <div id="speedometer">
    <div id="speed-value">0</div>
    <div id="speed-unit">km/h</div>
  </div>

  <div id="elevator-ui">
    <div class="elevator-panel">
      <div class="elevator-header">SELECT FLOOR</div>
      <div class="elevator-current">Current: <span id="elevator-current-floor">0</span></div>
      <div class="elevator-floors" id="elevator-floors"></div>
      <div class="elevator-footer">Press <span class="key">ESC</span> to cancel</div>
    </div>
  </div>

  <div id="status"><span class="dot"></span><span id="status-text">connecting…</span></div>
  <script>
    window.addEventListener('error', (e) => {
      document.getElementById('status-text').textContent = 'ERR: ' + e.message;
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
